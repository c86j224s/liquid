[package]
name = "liquid-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["sync"] }
tower-http = { version = "0.5", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
pulldown-cmark = "0.10"
liquid-files = { path = "../liquid-files" }
liquid-protocol = { path = "../liquid-protocol" }
liquid-research-core = { path = "../liquid-research-core" }
liquid-workspace = { path = "../liquid-workspace" }
