[package]
name = "liquid-bench"
version = "0.9.0"
edition = "2021"

[[bin]]
name = "research_bench"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
clap = { version = "4.6.1", features = ["derive", "env"] }
liquid = { path = "../.." }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
url = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
